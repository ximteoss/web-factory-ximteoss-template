2. Invoke 02-designer.md reading harness/client-briefing.md and harness/skills/impeccable-taste.md. Output the UI/UX blueprint to harness/design-spec.md.
3. Invoke 03-architect.md to build the production React/TypeScript/Tailwind application inside src/, strictly adhering to harness/design-spec.md and harness/skills/motion-components.md.
