description = "Executes the autonomous 5-stage multi-agent web factory pipeline with Hallmark in src/"
prompt = """
Activate Orchestrator Mode as defined in GEMINI.md.
Client Input & Constraints: {{args}}

Execute the following 5 sequential phases strictly using the definitions in harness/agents/:
1. Invoke 01-scraper.md using Playwright MCP tools on the provided URLs. Save structured findings to harness/client-briefing.md.
2. Invoke 02-copywriter.md reading harness/client-briefing.md. Output the finalized, localized copy deck to harness/copy-deck.md.
3. Invoke 03-designer.md reading harness/client-briefing.md, harness/copy-deck.md, and applying harness/skills/hallmark/hallmark.md. Pause ONLY ONCE to let the user choose among the dealt Hallmark graphic styles/Picks block before saving harness/design-spec.md and continuing.
4. Invoke 04-architect.md to build the production React/TypeScript/Tailwind application inside src/, adhering to harness/design-spec.md, harness/copy-deck.md, and harness/skills/motion-components.md.
5. Invoke 05-qa-auditor.md to run 'npm run build', execute Hallmark's linter ('node harness/skills/hallmark/scripts/sloplint.mjs src/ --render'), fix any FAILs, and verify zero runtime console errors.
"""