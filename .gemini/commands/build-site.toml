description = "Executes the autonomous 4-stage multi-agent web factory pipeline in src/"
prompt = """
Activate Orchestrator Mode as defined in GEMINI.md.
Client Input & Constraints: {{args}}

Execute the following 4 sequential phases strictly using the definitions in harness/agents/:
